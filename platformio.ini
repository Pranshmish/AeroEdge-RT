; AeroEdge-RT: PlatformIO Project Configuration
; Dual-Core Autonomous Micro-Kernel & Quantized Inference Engine

[platformio]
default_envs = esp32s3
src_dir = main
include_dir = include

[env]
framework = espidf
monitor_speed = 115200
monitor_filters = direct, esp32_exception_decoder
build_flags =
    -std=gnu++17
    -O3
    -Wall
    -Wextra
    -Wno-missing-field-initializers
    -Iinclude
    -Imodels

; Target 1: ESP32-S3 (Xtensa LX7 Dual-Core with Vector Extension)
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Target 2: ESP32 Standard (Xtensa LX6 Dual-Core)
[env:esp32]
platform = espressif32
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
